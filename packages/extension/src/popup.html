<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-page-bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 12px 14px;
        font-size: 13px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
        letter-spacing: 0.5px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      .pill {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 999px;
        background: #8883;
      }
      .pill.on {
        background: #2e7d32;
        color: #fff;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #8886;
        background: #8881;
        cursor: pointer;
      }
      button.primary {
        background: #1565c0;
        color: #fff;
        border-color: transparent;
      }
      input {
        font: inherit;
        padding: 5px 8px;
        border-radius: 6px;
        border: 1px solid #8886;
        background: transparent;
        color: inherit;
      }
      .settings {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 10px 0;
      }
      .panel {
        border: 1px solid #8883;
        border-radius: 10px;
        padding: 9px;
        margin: 10px 0;
        background: #8881;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .field label {
        width: 46px;
        opacity: 0.8;
      }
      .field input {
        flex: 1;
        min-width: 0;
      }
      button.full {
        width: 100%;
      }
      .picker-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .picker-actions .wide {
        grid-column: 1 / -1;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }
      .selection-list {
        margin-top: 8px;
      }
      .selection-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
      }
      .selection-item button {
        padding: 2px 7px;
        border-radius: 4px;
        min-width: 24px;
      }
      .selection-item button[data-remove-selection]:hover {
        background: #d32f2f;
        border-color: #d32f2f;
        color: #fff;
      }
      .selection-item button[data-remove-selection] {
        align-self: start;
        justify-self: end;
        line-height: 1;
      }
      .selection-meta {
        min-width: 0;
      }
      .selection-edit {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 6px;
      }
      .selection-edit input {
        min-width: 0;
      }
      .patch-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
      }
      .patch-meta {
        min-width: 0;
      }
      .patch-item pre {
        max-height: 72px;
        overflow: auto;
        margin: 5px 0 0;
        white-space: pre-wrap;
        font-size: 10px;
        opacity: 0.72;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 0;
        list-style: none;
      }
      li {
        padding: 5px 8px;
        border: 1px solid #8883;
        border-radius: 8px;
        margin-bottom: 5px;
      }
      .muted {
        opacity: 0.6;
        font-size: 11px;
      }
      .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><img src="icons/icon.svg" width="16" height="16" alt="" style="vertical-align:-2px" /> mcp-page-bridge</h1>
      <span id="conn" class="pill">…</span>
    </header>

    <div class="row">
      <button id="toggle" class="primary">Enable on this tab</button>
      <button id="openDashboard">Dashboard ↗</button>
    </div>

    <div class="panel" id="designPanel">
      <div class="picker-actions">
        <button id="pickElement">Pick element</button>
        <button id="addElement">Add another</button>
        <button id="clearSelection" class="wide">Clear selection</button>
      </div>
      <label class="switch-row">
        <span>View selection</span>
        <input id="viewSelection" type="checkbox" checked />
      </label>
      <div id="selectedElements" class="selection-list"></div>
      <p id="pickerHint" class="muted">
        Pick replaces current selection. Add another keeps existing yellow markers.
      </p>
    </div>

    <div class="panel" id="cssPanel">
      <div class="row" style="justify-content: space-between; margin-top: 0">
        <strong>CSS patches</strong>
        <button id="clearCssPatches">Clear all</button>
      </div>
      <div id="cssPatches" class="selection-list"></div>
    </div>

    <div id="settings" class="settings">
      <div class="field">
        <label for="port">Port</label>
        <input id="port" type="number" min="1" max="65535" />
      </div>
      <div class="field">
        <label for="token">Token</label>
        <input id="token" type="text" placeholder="(optional)" />
      </div>
      <button id="saveSettings" class="full">Save settings</button>
    </div>

    <div class="row">
      <label><input id="coreTools" type="checkbox" checked /> Core tools (default MCPs)</label>
    </div>

    <div class="row">
      <label><input id="designTools" type="checkbox" /> Design tools (selection, CSS, audits)</label>
    </div>

    <div class="row">
      <label><input id="automationTools" type="checkbox" /> Automation tools (locators, network, storage)</label>
    </div>

    <div class="row">
      <label><input id="cdpTools" type="checkbox" /> Advanced CDP tools (optional debugger)</label>
    </div>
    <p id="cdpHint" class="muted">CDP tools require an optional debugger permission.</p>

    <div class="row">
      <label><input id="browserControl" type="checkbox" /> Browser control (all tabs)</label>
    </div>

    <div id="providers"></div>

    <p class="muted">
      Run the bridge: <code>npx mcp-page-bridge</code>. Pages expose tools via
      <code>window.mcp</code>.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
