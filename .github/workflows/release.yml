name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload the extension zip
  id-token: write # required for npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches mcp-page-bridge version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/server/package.json').version")"
          PROTOCOL="$(node -p "require('./packages/protocol/package.json').version")"
          EXT="$(node -p "require('./packages/extension/manifest.json').version")"
          GO="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/protocol/protocol.go)"
          echo "tag=$TAG package=$PKG protocol=$PROTOCOL extension=$EXT go=$GO"
          test "$TAG" = "$PKG" || { echo "::error::Tag v$TAG does not match mcp-page-bridge@$PKG"; exit 1; }
          test "$TAG" = "$PROTOCOL" || { echo "::error::Tag v$TAG does not match mcp-page-bridge-protocol@$PROTOCOL"; exit 1; }
          test "$TAG" = "$EXT" || { echo "::error::Tag v$TAG does not match extension@$EXT"; exit 1; }
          test "$TAG" = "$GO" || { echo "::error::Tag v$TAG does not match internal/protocol Version=$GO"; exit 1; }
          node -e '
            // optionalDependencies must NOT be committed; scripts/build-npm-packages.mjs
            // injects them at publish time (see its header comment).
            const pkg = require("./packages/server/package.json");
            if (pkg.optionalDependencies) { console.error("optionalDependencies must not be committed in packages/server/package.json"); process.exit(1); }
          '

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm -r --if-present build

      - name: Verify dashboard embed is in sync
        run: |
          git diff --exit-code internal/server/assets/dashboard.html || {
            echo "::error::dashboard embed is stale; run 'pnpm --filter mcp-page-bridge-dashboard build' and commit"; exit 1; }

      - name: Go test
        run: go test ./...

      - name: Build standalone binaries (goreleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish,announce,validate

      - name: Build npm platform packages
        run: node scripts/build-npm-packages.mjs

      - name: Publish mcp-page-bridge-protocol to npm (with provenance)
        run: |
          VERSION="$(node -p "require('./packages/protocol/package.json').version")"
          if npm view "mcp-page-bridge-protocol@$VERSION" version >/dev/null 2>&1; then
            echo "mcp-page-bridge-protocol@$VERSION already exists; skipping"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          echo "Publishing mcp-page-bridge-protocol@$VERSION with dist-tag '$DIST_TAG'"
          (cd packages/protocol && pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG")
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish platform binary packages to npm (with provenance)
        # pnpm (not npm) because OIDC trusted publishing needs npm >= 11.5.1 and
        # Node 22 ships npm 10. Note pnpm pack strips the binary's executable
        # bit; the wrapper's launcher restores it before spawning.
        run: |
          VERSION="$(node -p "require('./packages/server/package.json').version")"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          for dir in npm-dist/*/; do
            NAME="$(node -p "require('./$dir/package.json').name")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already exists; skipping"
              continue
            fi
            echo "Publishing $NAME@$VERSION with dist-tag '$DIST_TAG'"
            (cd "$dir" && pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG")
          done
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish mcp-page-bridge wrapper to npm (with provenance)
        run: |
          VERSION="$(node -p "require('./packages/server/package.json').version")"
          if npm view "mcp-page-bridge@$VERSION" version >/dev/null 2>&1; then
            echo "mcp-page-bridge@$VERSION already exists; skipping"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          echo "Publishing mcp-page-bridge@$VERSION with dist-tag '$DIST_TAG'"
          (cd packages/server && pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG")
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Zip the extension
        run: |
          cd packages/extension/dist
          zip -r "$GITHUB_WORKSPACE/mcp-page-bridge-extension-${GITHUB_REF_NAME}.zip" .

      - name: Package Firefox extension
        run: pnpm pack:extension:firefox

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; else PRERELEASE=""; fi
          gh release create "$GITHUB_REF_NAME" \
            "mcp-page-bridge-extension-${GITHUB_REF_NAME}.zip" \
            "mcp-page-bridge-extension-firefox-${GITHUB_REF_NAME}.zip" \
            dist/mcp-page-bridge-*.tar.gz \
            dist/mcp-page-bridge-*.zip \
            dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
