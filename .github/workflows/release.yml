name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload the extension zip
  id-token: write # required for npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches r-mcp version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/server/package.json').version")"
          EXT="$(node -p "require('./packages/extension/manifest.json').version")"
          echo "tag=$TAG package=$PKG extension=$EXT"
          test "$TAG" = "$PKG" || { echo "::error::Tag v$TAG does not match r-mcp@$PKG"; exit 1; }
          test "$TAG" = "$EXT" || { echo "::error::Tag v$TAG does not match extension@$EXT"; exit 1; }

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm -r --if-present build

      - name: Publish r-mcp to npm (with provenance)
        working-directory: packages/server
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          echo "Publishing r-mcp@$VERSION with dist-tag '$DIST_TAG'"
          pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG"
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Zip the extension
        run: |
          cd packages/extension/dist
          zip -r "$GITHUB_WORKSPACE/r-mcp-extension-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; else PRERELEASE=""; fi
          gh release create "$GITHUB_REF_NAME" \
            "r-mcp-extension-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
