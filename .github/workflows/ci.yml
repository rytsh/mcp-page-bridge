name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm -r --if-present build

      - name: Build Firefox extension
        run: pnpm --filter @mcp-page-bridge/extension build:firefox

      - name: Verify dashboard embed is in sync
        run: |
          git diff --exit-code internal/server/assets/dashboard.html || {
            echo "::error::dashboard embed is stale; run 'pnpm --filter mcp-page-bridge-dashboard build' and commit"; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./...

      - name: Go build
        run: go build ./...
